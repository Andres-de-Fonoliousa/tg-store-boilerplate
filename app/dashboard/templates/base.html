<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f5f6fa;margin:0;color:#202124}
.nav{background:#1a1a2e;color:#fff;padding:14px 24px;display:flex;gap:18px;align-items:center}
.nav a{color:#cfd8ff;text-decoration:none;font-size:14px}
.nav a:hover{color:#fff}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid #ececf1;text-align:right}
th{color:#5f6368;font-size:12px;text-transform:uppercase}
.btn{display:inline-block;padding:7px 14px;border-radius:8px;font-size:13px;border:0;cursor:pointer;text-decoration:none;color:#fff}
.btn-green{background:#188038}.btn-red{background:#d93025}.btn-blue{background:#1a73e8}.btn-gray{background:#5f6368}
input,select,textarea{width:100%;padding:8px;border:1px solid #dadce0;border-radius:8px;font-size:13px;box-sizing:border-box}
label{font-size:13px;color:#5f6368;display:block;margin:10px 0 4px}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.b-pending{background:#fef7e0;color:#b06000}.b-completed{background:#e6f4ea;color:#188038}
.b-cancelled{background:#fce8e6;color:#d93025}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat b{display:block;font-size:24px;margin-top:4px}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.flash-success{background:#e6f4ea;color:#188038}.flash-error{background:#fce8e6;color:#d93025}
</style>
</head>
<body>
<div class="nav">
  <b>🛍️ لوحة المتجر</b>
  <a href="{{ url_for('admin_dashboard') }}">الرئيسية</a>
  <a href="{{ url_for('manage_orders') }}">الطلبات</a>
  <a href="{{ url_for('manage_deposits') }}">الشحنات</a>
  <a href="{{ url_for('manage_catalog') }}">الكتالوج</a>
  <a href="{{ url_for('manage_settings') }}">الإعدادات</a>
  <a href="{{ url_for('logout') }}" style="margin-right:auto">خروج</a>
</div>
<div class="wrap">
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="flash flash-{{ cat }}">{{ msg }}</div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</div>
</body>
</html>
