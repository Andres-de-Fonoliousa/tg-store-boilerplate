{% extends "base.html" %}
{% block title %}دخول{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h2>🔐 دخول الأدمن</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>رمز الدخول</label>
    <input type="password" name="code" required autofocus>
    <button class="btn btn-blue" style="margin-top:14px;width:100%">دخول</button>
  </form>
</div>
{% endblock %}
